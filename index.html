<!DOCTYPE html>
<html>
<head>
    <title>Important Question 🤔</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffe6e6;
            margin-top: 150px;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            margin: 10px;
            cursor: pointer;
        }

        #yesBtn {
            background-color: #4CAF50;
            color: white;
            border: none;
        }

        #noBtn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            position: relative;
        }

        #datePage {
            display: none;
        }

        #hoverPrompt {
            max-width: 420px;
            margin: 25px auto 0;
            padding: 18px 22px;
            color: white;
            border-radius: 18px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.18);
            opacity: 0;
            visibility: hidden;
            transition: opacity 2s ease, visibility 2s ease;
            background: linear-gradient(135deg, rgba(255, 77, 109, 0.95), rgba(255, 140, 148, 0.95));
            background-size: cover;
            background-position: center;
        }

        #hoverPrompt.show {
            opacity: 1;
            visibility: visible;
        }

        #hoverPrompt.prompt-angry {
            background: linear-gradient(135deg, rgba(255, 132, 0, 0.95), rgba(255, 77, 77, 0.95));
        }

        #hoverPrompt.prompt-rum {
            background: linear-gradient(135deg, rgba(70, 16, 16, 0.95), rgba(70, 16, 16, 0.95));
            color: white;
        }

        #hoverPromptText {
            margin: 0;
            font-size: 24px;
            color: white;
        }

        #hoverPromptFace {
            display: none;
            font-size: 32px;
            margin-left: 8px;
            display: inline;
        }

        #datePage input {
            font-size: 18px;
            padding: 10px;
            margin: 10px;
            border: 2px solid #ff4d4d;
            border-radius: 8px;
        }

        #datePage label {
            font-size: 20px;
            display: block;
            margin-top: 15px;
        }

        #submitDate {
            background-color: #4CAF50;
            color: white;
            border: none;
            margin-top: 20px;
        }

        #submitDate:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div id="mainPage">
    <h1>Will you go out with me? 🤔</h1>
    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No 😢</button>
    <div id="hoverPrompt" aria-live="polite">
        <p id="hoverPromptText"><span id="hoverPromptFace"></span></p>
    </div>
</div>

<div id="datePage">
    <h1>Yay! 🎉❤️</h1>
    <h2>When would you like to go out?</h2>
    <label for="dateInput">Choose a date:</label>
    <input type="date" id="dateInput" />
    <label for="timeInput">Choose a time:</label>
    <input type="time" id="timeInput" />
    <br />
    <button id="submitDate">Let's do it! 💕</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/index.min.js"></script>
<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const mainPage = document.getElementById("mainPage");
const datePage = document.getElementById("datePage");
const submitDate = document.getElementById("submitDate");
const hoverPrompt = document.getElementById("hoverPrompt");
const hoverPromptText = document.getElementById("hoverPromptText");
const hoverPromptFace = document.getElementById("hoverPromptFace");

let size = 20;
let noHoverCount = 0;
let rumMode = false;
let resetCount = 0;

// Initialize EmailJS
emailjs.init({
    publicKey: "8KRs1u3JrKxsT2Dor"
});

function showHoverPrompt(message, promptClass, showFace, faceEmoji) {
    hoverPrompt.classList.remove("show", "prompt-angry", "prompt-rum");
    hoverPromptText.textContent = message;
    hoverPromptFace.textContent = showFace ? faceEmoji : "";
    if (promptClass) {
        hoverPrompt.classList.add(promptClass);
    }
    void hoverPrompt.offsetWidth;
    hoverPrompt.classList.add("show");
}

function setNormalBackground() {
    document.body.style.backgroundImage = "none";
    document.body.style.backgroundColor = "#ffe6e6";
    document.body.style.backgroundSize = "";
    document.body.style.backgroundPosition = "";
    document.body.style.backgroundRepeat = "";
}

function setRumBackground() {
    document.body.style.backgroundColor = "#1a1a1a";
    document.body.style.backgroundImage = "none";
    document.body.style.backgroundSize = "";
    document.body.style.backgroundPosition = "";
    document.body.style.backgroundRepeat = "";
}

noBtn.addEventListener("mouseover", () => {
    if (rumMode) {
        resetCount += 1;
        
        if (resetCount > 0) {
            setNormalBackground();
            rumMode = false;
            noHoverCount = 0;
            resetCount = 0;
            showHoverPrompt("Aight, we back 😌", "", false, "");
            return;
        }
    }

    noHoverCount += 1;
    const x = Math.random() * (window.innerWidth - 150);
    const y = Math.random() * (window.innerHeight - 100);

    noBtn.style.position = "absolute";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    size += 5;
    yesBtn.style.fontSize = size + "px";

    if (noHoverCount === 3) {
        showHoverPrompt("Oi wa you doing, look the yes dey!?!", "", false, "");
    } else if (noHoverCount === 6) {
        showHoverPrompt("¿Estás de payaso hoy o qué?", "prompt-angry", true, "😠");
    } else if (noHoverCount === 9) {
        setRumBackground();
        rumMode = true;
        resetCount = 0;
        showHoverPrompt("lemme go drink some rum yes😒", "prompt-rum", false, "");
    }
});

yesBtn.addEventListener("click", () => {
    mainPage.style.display = "none";
    datePage.style.display = "block";
});

submitDate.addEventListener("click", () => {
    const date = document.getElementById("dateInput").value;
    const time = document.getElementById("timeInput").value;

    if (!date || !time) {
        alert("Please choose both a date and a time! ❤️");
        return;
    }

    const dateObj = new Date(date + "T" + time);
    const options = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
    const formattedDate = dateObj.toLocaleDateString(undefined, options);
    const formattedTime = dateObj.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });

    // Disable button to prevent duplicate submissions
    submitDate.disabled = true;
    submitDate.textContent = "Sending... 📧";

    // Send email using EmailJS
    emailjs.send("service_c4ixs7f", "template_dateconfirm", {
        to_email: "micahbi@yahoo.com",
        date: formattedDate,
        time: formattedTime,
        message: "She said yes! Here's when they're meeting up!"
    }).then(() => {
        // Show confirmation message
        document.body.innerHTML =
            "<h1>Can't wait! 🎉❤️</h1>" +
            "<h2>It's a date on " + formattedDate + " at " + formattedTime + "!</h2>" +
            "<p style='font-size: 18px; margin-top: 20px;'>Confirmation email sent! 📧</p>";
    }).catch((error) => {
        console.error("Email sending failed:", error);
        // Still show confirmation even if email fails, but alert the user
        alert("Date saved! (Email sending had an issue, but your date is confirmed)");
        document.body.innerHTML =
            "<h1>Can't wait! 🎉❤️</h1>" +
            "<h2>It's a date on " + formattedDate + " at " + formattedTime + "!</h2>";
    });
});
</script>

</body>
</html>
